# Default values for draexample--driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

# deviceProfile describes the overall shape of the devices managed by the
# driver. The default is "gpu" so the existing demo and tests keep working
# without any changes; pick a different profile only when you specifically
# want the KubeVirt-targeted behavior.
#
# Available profiles:
#   - "gpu":      (default) Node-local mock GPUs configurable through
#                 opaque config. This is what the README quickstart
#                 and the demo/gpu-test*.yaml fixtures exercise.
#   - "vfio-gpu": Real PCI devices already bound to the vfio-pci
#                 kernel driver, discovered by walking
#                 /sys/bus/pci/drivers/vfio-pci. Each such device is
#                 advertised as a DRA device with attributes for
#                 the PCI bus ID, vendor/device/class, IOMMU group
#                 and NUMA node - vendor/device/class are sourced
#                 from /sys/bus/pci/devices/<BDF>/. /dev/vfio/<group>
#                 + /dev/vfio/vfio are automatically injected into
#                 the consumer pod's CDI spec so KubeVirt's
#                 virt-launcher can drive QEMU with
#                 `-device vfio-pci,host=<BDF>`. Use with
#                 demo/vfio-vm-test.yaml.
#
# Examples:
#   helm install ... dra-example-driver deployments/helm/dra-example-driver
#   helm install ... --set deviceProfile=vfio-gpu dra-example-driver-vfio-gpu deployments/helm/dra-example-driver
#
# The driverName (and therefore the DeviceClass name) defaults to
# "<deviceProfile>.example.com", so the profiles can coexist in the
# same cluster as separate driver instances.
deviceProfile: "gpu"

# driverName uniquely identifies the driver within the cluster. When empty, its
# value is derived from the deviceProfile.
driverName: ""

imagePullSecrets: []
image:
  repository: registry.k8s.io/dra-example-driver/dra-example-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

kubeletPlugin:
  # numDevices describes how many mock devices to advertise on each
  # node. Honored only by the "gpu" profile - the "vfio-gpu" profile
  # always discovers real devices by walking the kernel-supplied
  # sysfs tree (see `pci.sysfsRoot` below).
  numDevices: 8

  # pci configures the "vfio-gpu" device profile. It only takes effect
  # when `deviceProfile=vfio-gpu`.
  #
  pci:
    sysfsRoot: /sys/bus/pci/drivers/vfio-pci
    devicesRoot: /sys/bus/pci/devices
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    # for seamless rolling updates, maxSurge can be greater than 0.
    # See: https://pkg.go.dev/k8s.io/dynamic-resource-allocation/kubeletplugin#RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  enableDeviceMetadata: false
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port running a gRPC health service checked by a livenessProbe.
      # Set to a negative value to disable the service and the probe.
      healthcheckPort: 51515

webhook:
  enabled: false
  servicePort: 443
  containerPort: 443
  priorityClassName: "system-cluster-critical"
  strategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  containers:
    webhook:
      securityContext:
        privileged: false
      resources: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
